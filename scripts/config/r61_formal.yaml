schema_version: 1
namespace: R61-FORMAL-v1
# D5 was generated in its own frozen namespace; preserve those original seeds.
namespace_by_dgp:
  D5: R61-D5-BALANCED-v1
output_dir: results/reproduction/simulation

# Formal study settings for the publication analysis.
replications:
  main_reps: 500
  sensitivity_reps: 100
  kmax_reps: 100
  status: frozen_for_publication_run

design:
  trials: 64
  geometry_file: scripts/config/r61_congruency_geometry.csv
  participants: 500
  holdout_trials_per_participant: 13
  beta0: 0.0
  beta1: 0.05
  participant_sd: 0.4
  residual_sd: 0.4

nominal_model:
  kmax: 4
  min_segment: 8
  prior_factorial_power: 1.0

sampler:
  chains: 3
  iterations: 15000
  warmup: 2000
  initial_k: [0, 2, 4]

diagnostics:
  max_split_Rhat: 1.05
  min_bulk_ESS: 1500
  D4_N500_K_min_bulk_ESS: 2000

dgps:
  D0: {cuts: [], levels: [0.0]}
  D1: {cuts: [], levels: [0.08]}
  D2: {cuts: [16], levels: [0.14, 0.04]}
  D3: {cuts: [48], levels: [0.04, 0.14]}
  D4: {cuts: [16, 48], levels: [0.12, 0.03, 0.10]}
  D5: {cuts: [13, 25, 39, 51], levels: [0.13125, 0.03125, 0.13125, 0.03125, 0.13125]}

sensitivity:
  sample_size:
    - {dgp: D1, participants: 1000}
    - {dgp: D5, participants: 1000}
  signal_multiplier:
    - {dgp: D5, value: 0.6}
    - {dgp: D5, value: 1.4}
  training_mcar:
    - {dgp: D5, value: 0.05}
    - {dgp: D5, value: 0.15}
  prior_factorial_power:
    - {dgp: D1, value: 0.0, label: flat}
    - {dgp: D5, value: 0.0, label: flat}
    - {dgp: D1, value: 2.0, label: strong_occam}
    - {dgp: D5, value: 2.0, label: strong_occam}
  min_segment:
    - {dgp: D5, value: 6}
    - {dgp: D5, value: 10}

kmax_sensitivity:
  - {dgp: D1, value: 3}
  - {dgp: D5, value: 3}
  - {dgp: D1, value: 5}
  - {dgp: D5, value: 5}
