name: Public reproduction checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  numerical-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: gcc --version
      - run: python -m pip install -e ".[test]"
      - run: python scripts/reproduce.py validate
      - run: python -m pytest -q
      - run: python scripts/reproduce.py smoke --workers 2
      - run: python scripts/reproduce.py revision-smoke --workers 2
