name: Public reproduction checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/reproduce.py validate
      - run: python scripts/reproduce.py smoke --workers 2
